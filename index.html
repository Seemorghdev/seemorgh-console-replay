  .copilot-modal[hidden]{display:none}.copilot-modal{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:18px;background:rgba(28,31,35,.32)}.copilot-dialog{width:min(438px,100%);max-height:min(680px,calc(100dvh - 36px));display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:0;background:#fff}.copilot-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);background:#fff}.copilot-head h2{font:600 14px var(--sans)}.copilot-head p{margin-top:3px;color:var(--dim);font-size:11px}.copilot-head .copilot-close{margin-left:auto;width:28px;height:28px;border:1px solid var(--line);border-radius:0;background:#fff;color:var(--dim);cursor:pointer;font-size:15px}.copilot-head .copilot-close:hover{background:var(--surface-2)}.copilot-proven{display:inline-block;margin-top:5px;color:var(--proven);font:600 9px var(--mono)}.copilot-thread{display:grid;gap:9px;overflow:auto;padding:13px}.copilot-message{max-width:94%;padding:9px 10px;border:1px solid var(--line);border-radius:0;background:var(--surface-2);color:var(--ink);font-size:11.5px;line-height:1.5}.copilot-message.operator{margin-left:auto;border-color:var(--sel-line);background:var(--sel);color:var(--ink)}.copilot-message strong{display:block;margin-bottom:4px;color:var(--dim);font:600 10px var(--sans)}.copilot-source{display:block;margin:-1px 0 7px;color:var(--ai);font:600 9px var(--mono)}.copilot-message p + p{margin-top:6px}.copilot-message.boundary{border-left:2px solid var(--unknown)}.copilot-pending{color:var(--dim);font-size:11px}.copilot-options{padding:11px 13px;border-top:1px solid var(--line);background:var(--surface-2)}.copilot-options h3{margin-bottom:7px;color:var(--dim);font:600 11px var(--sans)}.copilot-options button{display:block;width:100%;margin-top:5px;padding:7px 9px;border:1px solid var(--line);border-radius:0;background:#fff;color:var(--ink);text-align:left;cursor:pointer;font-size:11px;line-height:1.4}.copilot-options button:hover{border-color:var(--sel-line);background:var(--sel);color:var(--ink)}.copilot-options button:disabled{opacity:.55;cursor:wait}.copilot-foot{padding:8px 13px;border-top:1px solid var(--line);color:var(--dim);font-size:10px;line-height:1.4}.utility button.copilot-launch{color:var(--ai)}.utility button.copilot-launch[aria-expanded="true"]{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
  @media(max-width:650px){.copilot-modal{align-items:end;padding:0}.copilot-dialog{width:100%;max-height:78dvh;border-radius:0}.copilot-thread{max-height:42dvh}}
