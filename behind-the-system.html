<!DOCTYPE html>
<html lang="en" data-mode="replay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seemorgh — Behind the System</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#0f1729; --panel2:#121c33; --ink:#e8eefc; --dim:#8ea1c4; --faint:#5a6b8c;
    --line:rgba(120,150,220,.16); --line2:rgba(120,150,220,.30);
    --proven:#38f5b0; --field:#6be3ff; --synthetic:#c98bff; --roadmap:#ff8f6b; --gcs:#59a7ff;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace; --disp:"Bahnschrift","DIN Alternate","Oswald",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.6;}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:11px 22px;background:rgba(15,23,41,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .top .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--gcs),var(--synthetic));}
  .top .nm{font-family:var(--disp);font-size:14px;letter-spacing:2px;} .top .sub{font-size:10px;color:var(--faint);}
  .top .sp{flex:1;}
  .backop{font-family:var(--disp);border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:999px;padding:7px 15px;font-size:12px;cursor:pointer;}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 22px 80px;}
  .lede h1{font-family:var(--disp);font-size:26px;letter-spacing:.5px;margin:6px 0 12px;}
  .lede p{color:var(--dim);max-width:74ch;}
  .toc{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px;}
  .toc a{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 11px;text-decoration:none;}
  .toc a:hover{background:var(--panel2);}
  .chapter{border-top:1px solid var(--line);padding:24px 0 4px;}
  .chapter .num{font-family:var(--disp);font-size:11px;color:var(--faint);letter-spacing:1px;}
  .chapter h2{font-family:var(--disp);font-size:19px;letter-spacing:.5px;margin:4px 0 8px;}
  .chapter p{color:var(--dim);max-width:74ch;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .ev-badge{font-family:var(--disp);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
  .ev-proven{background:rgba(56,245,176,.13);color:var(--proven);border:1px solid rgba(56,245,176,.4);}
  .ev-field{background:rgba(107,227,255,.12);color:var(--field);border:1px solid rgba(107,227,255,.4);}
  .ev-synthetic{background:rgba(201,139,255,.12);color:var(--synthetic);border:1px solid rgba(201,139,255,.4);}
  .ev-roadmap{background:rgba(255,143,107,.1);color:var(--roadmap);border:1px solid rgba(255,143,107,.35);}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;}
  @media(max-width:820px){.cols{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .card h3{font-family:var(--disp);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
  .metric{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
  .metric .n{font-family:var(--disp);font-size:18px;} .metric .l{color:var(--dim);font-size:12px;}
  .ba{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0;}
  .ba .cell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
  .ba .cell .n{font-family:var(--disp);font-size:17px;} .ba .cell .l{font-size:10px;color:var(--faint);}
  .note{font-size:11px;color:var(--faint);margin-top:8px;}
  .muted{color:var(--faint);} .pending{color:var(--roadmap);}
  .replay-note{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2000;max-width:calc(100vw - 24px);padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:rgb(32,35,35);color:var(--ink);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div class="top">
  <div class="mk"></div>
  <div><div class="nm">BEHIND THE SYSTEM</div><div class="sub">project evidence &amp; case study · not the operator console</div></div>
  <div class="sp"></div>
  <button class="backop" id="backop">← Operator Console</button>
</div>
<div class="wrap">
  <div class="lede">
    <div class="num" style="font-family:var(--disp);font-size:11px;color:var(--faint);letter-spacing:1px">CASE STUDY</div>
    <h1>How Seemorgh builds one honest air picture</h1>
    <p id="origin"></p>
  </div>
  <div class="toc" id="toc"></div>
  <div id="chapters"></div>
</div>
<script type="module" src="behind.js"></script>
</body>
</html>
