<!DOCTYPE html>
<html lang="en" data-mode="replay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seemorgh — Behind the System</title>
<style>
  /* Same plain layout as the operator console and the Edge Evidence workbench. */
  :root{
    --bg:#fff; --panel:#fff; --panel2:#f6f7f8; --ink:#1c1f23; --dim:#5d646d; --faint:#737a83;
    --line:#d6d9dd; --line2:#b9bec4; --link:#1f5fbf;
    --proven:#2f7d32; --field:#1f5fbf; --synthetic:#6d5a9c; --roadmap:#a8650a; --gcs:#1c1f23;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --disp:var(--sans);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;}
  a{color:var(--link);}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);}
  .top .mk{width:20px;height:20px;border:1px solid var(--ink);position:relative;}
  .top .mk:after{content:"";position:absolute;inset:5px;border:1px solid var(--ink);}
  .top .nm{font-weight:600;font-size:13px;letter-spacing:1px;} .top .sub{font-size:12px;color:var(--dim);}
  .top .sp{flex:1;}
  .backop{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:0;padding:4px 10px;cursor:pointer;}
  .backop:hover{background:var(--panel2);}
  .backop:focus-visible{outline:2px solid var(--link);outline-offset:1px;}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 20px 64px;}
  .lede h1{font-size:22px;font-weight:600;margin:4px 0 10px;}
  .lede p{color:var(--dim);max-width:74ch;}
  .toc{display:flex;flex-wrap:wrap;gap:0;margin:18px 0 6px;}
  .toc a{font-size:13px;color:var(--ink);border:1px solid var(--line);margin:0 -1px -1px 0;padding:4px 10px;text-decoration:none;}
  .toc a:hover{background:var(--panel2);}
  .chapter{border-top:1px solid var(--line);padding:22px 0 4px;}
  .chapter .num{font-family:var(--mono);font-size:12px;color:var(--dim);}
  .chapter h2{font-size:17px;font-weight:600;margin:4px 0 8px;}
  .chapter p{color:var(--dim);max-width:74ch;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .ev-badge{font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line);border-left-width:3px;background:#fff;}
  .ev-proven{color:var(--proven);border-left-color:var(--proven);}
  .ev-field{color:var(--field);border-left-color:var(--field);}
  .ev-synthetic{color:var(--synthetic);border-left-color:var(--synthetic);}
  .ev-roadmap{color:var(--roadmap);border-left-color:var(--roadmap);}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;}
  @media(max-width:820px){.cols{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:12px 14px;}
  .card h3{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px;}
  .metric{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);}
  .metric .n{font-family:var(--mono);font-size:15px;font-weight:600;} .metric .l{color:var(--dim);font-size:13px;}
  .ba{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0;}
  .ba .cell{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:10px;text-align:center;}
  .ba .cell .n{font-family:var(--mono);font-size:15px;font-weight:600;} .ba .cell .l{font-size:12px;color:var(--dim);}
  .note{font-size:12px;color:var(--dim);margin-top:8px;}
  .muted{color:var(--faint);} .pending{color:var(--roadmap);}
  .replay-note{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2000;max-width:calc(100vw - 24px);padding:4px 12px;border:1px solid #f0d3a8;border-radius:0;background:#fff4e5;color:var(--ink);font:12px/1.4 var(--sans);text-align:center;pointer-events:none}
</style>
</head>
<body>
<div class="top">
  <div class="mk"></div>
  <div><div class="nm">BEHIND THE SYSTEM</div><div class="sub">project evidence &amp; case study · not the operator console</div></div>
  <div class="sp"></div>
  <button class="backop" id="backop">← Operator Console</button>
</div>
<div class="wrap">
  <div class="lede">
    <div class="num" style="font-family:var(--disp);font-size:11px;color:var(--faint);letter-spacing:1px">CASE STUDY</div>
    <h1>How Seemorgh builds one honest air picture</h1>
    <p id="origin"></p>
  </div>
  <div class="toc" id="toc"></div>
  <div id="chapters"></div>
</div>
<script type="module" src="behind.js"></script>
</body>
</html>
